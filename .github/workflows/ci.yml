# Builds the app and the tools and runs the tests on macOS, Linux and Windows, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 9.0.5  # Keep in step with GIT_TAG in CMakeLists.txt

jobs:
  build-and-test:
    strategy:
      fail-fast: false  # One platform's failure shouldn't hide the others'
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      # JUCE is ~100 MB: keep a copy between runs instead of fetching it every time.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}
      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      # CMAKE_BUILD_TYPE is for the single-configuration generators (macOS, Linux); Visual Studio uses --config.
      - name: Configure
        run: |
          juce="$PWD/.juce"
          if [ "$RUNNER_OS" = Windows ]; then juce=$(cygpath -m "$juce"); fi  # Git Bash's /d/a/... means nothing to CMake
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_JUCE="$juce"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
