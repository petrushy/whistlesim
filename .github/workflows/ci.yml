# Builds the app and the tools on macOS and runs the tests, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 9.0.5  # Keep in step with GIT_TAG in CMakeLists.txt

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # JUCE is ~100 MB: keep a copy between runs instead of fetching it every time.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}
      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/.juce"
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
